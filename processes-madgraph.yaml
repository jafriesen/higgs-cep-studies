QCDbb:
  process_command: p p > b b~
  jet_type: b
  final_pdg: 5
  default_campaign:
    main: QCDbb__v02
    hadr-pythia: QCDbb__v02
    sim-delphes: QCDbb_DPy8_noFSR_200PU__v02
  campaigns:
    QCDbb__v01:
      phase_space:
        parton_pt_gev: [15.0, 80.0]
        max_abs_eta: 3.0
        dijet_mass_gev: [50.0, 160.0]
      mva_subcampaign: QCDbb_DPy8_noFSR_200PU__v01
      hadr-pythia:
        - QCDbb__v01
        - QCDbb_noFSR__v01
        - QCDbb_FSR__v01
      sim-delphes:
        - QCDbb__v01
        - QCDbb_noFSR__v01
        - QCDbb_FSR__v01
        - QCDbb_FSR_200PU__v01
        - QCDbb_DPy8_FSR_200PU__v01
        - QCDbb_DPy8_noFSR_200PU__v01
